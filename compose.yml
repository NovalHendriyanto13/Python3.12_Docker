version: "3.8"

services:
  peregerine:
    container_name: peregerine
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    command: "uvicorn main:app --host 0.0.0.0 --port 8080 --reload"
